version: '3.8'

services:
  # Signal client daemon + REST API wrapper
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-cli-api
    restart: unless-stopped
    environment:
      - MODE=json-rpc
      # Webhook URL pointing to our bot-server container
      - WEBHOOK_URL=http://bot-server:8000/webhook/signal
    volumes:
      # Persists registration & cryptographic keys across restarts
      - ./signal-data:/home/.local/share/signal-cli
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/about || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Our Python FastAPI Bot Server
  bot-server:
    build: .
    container_name: signal-ai-bot
    restart: unless-stopped
    depends_on:
      - signal-cli
    env_file:
      - .env
    environment:
      - SIGNAL_API_URL=http://signal-cli:8080
    volumes:
      - .:/app
    ports:
      - "8000:8000"
